<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{background:#242424;color:#ededed;font-family:system-ui;font-size:13px;margin:0;padding:16px;overflow:auto}h2{font-size:18px;margin:0 0 14px}button{display:block;width:100%;min-height:34px;margin:8px 0;padding:6px 10px;background:#414141;color:#fff;border:1px solid #606060;border-radius:5px}textarea{display:block;box-sizing:border-box;width:100%;height:64px;background:#303030;color:#fff;border:1px solid #606060;margin:6px 0;padding:6px}label{display:block;margin-top:14px;color:#c5c5c5}#status{font-size:14px;color:#a8d9b6;line-height:1.6;margin:14px 0}#detail{white-space:pre-wrap;word-break:break-all;line-height:1.6}#roots,#data{font-size:12px;word-break:break-all;color:#aaa}details{margin-top:18px}[hidden]{display:none}
