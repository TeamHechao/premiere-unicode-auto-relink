<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
:root{--bg:#242424;--panel:#2d2d2d;--border:#505050;--muted:#a9a9a9;--text:#ededed;--accent:#4da3ff;--ok:#a8d9b6;--gap:10px}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:13px;line-height:1.45;margin:0;padding:14px;overflow:auto}header{margin:0 0 14px}.title{font-size:17px;font-weight:600}.version{color:var(--muted);font-size:11px;font-weight:400;margin-left:4px}#status{color:var(--ok);font-size:13px;margin-top:4px;min-height:20px}.library{border:1px solid var(--border);border-radius:5px;background:var(--panel);padding:10px;margin-bottom:var(--gap)}.eyebrow{color:var(--muted);font-size:11px;margin-bottom:3px;text-transform:uppercase}.path{color:var(--text);font-size:12px;line-height:1.4;min-height:18px;overflow-wrap:anywhere;white-space:pre-wrap}button{background:#414141;border:1px solid #646464;border-radius:4px;color:#fff;cursor:pointer;font:inherit;min-height:32px;padding:6px 10px;width:100%}button:hover{background:#4b4b4b}button:disabled{cursor:default;opacity:.45}.primary{background:#256da8;border-color:#4da3ff}.primary:hover{background:#2d7fbe}.library button{margin-top:9px}.actions{display:grid;gap:var(--gap);margin-bottom:var(--gap)}.action-row{display:grid;gap:var(--gap);grid-template-columns:1fr 1fr}.detail{border-top:1px solid #3d3d3d;color:#c7c7c7;font-size:12px;line-height:1.5;margin-top:4px;padding-top:9px;overflow-wrap:anywhere;white-space:pre-wrap}.review{background:#5a3e19;border-color:#a98243;margin-top:10px}.review:hover{background:#6b4a20}details{border-top:1px solid #3d3d3d;margin-top:14px;padding-top:9px}summary{color:#c9c9c9;cursor:pointer;font-size:12px}label{color:var(--muted);display:block;margin-top:10px}textarea{background:#303030;border:1px solid #606060;border-radius:4px;color:#fff;display:block;font:inherit;height:58px;margin:5px 0 7px;padding:6px;resize:vertical;width:100%}.meta{color:var(--muted);font-size:11px;margin-top:10px}#data{color:#999;font-size:11px;overflow-wrap:anywhere;white-space:pre-wrap}[hidden]{display:none}
</style></head><body><header><div class="title">素材自动补链 <span class="version">0.1.2</span></div><div id="status" role="status" aria-live="polite">正在初始化…</div></header><section class="library"><div class="eyebrow">素材库</div><div id="roots" class="path">尚未选择素材库</div><button id="choose" class="primary">选择素材库并启用</button></section><section class="actions"><button id="open" class="primary">打开工程并检查</button><div class="action-row"><button id="scan">立即检查</button><button id="toggle" hidden>暂停自动检查</button></div></section><div id="detail" class="detail"></div><button id="acknowledge" class="review" hidden>核对完成，继续检查</button><details><summary>高级设置</summary><label for="aliases">旧素材库目录名（每行一个）</label><textarea id="aliases" aria-label="旧素材库目录名"></textarea><button id="save-aliases">保存</button><div class="meta">备份与记录</div><div id="data"></div></details><script src="core.js"></script><script src="host.js"></script><script src="store.js"></script><script src="main.js"></script></body></html>
